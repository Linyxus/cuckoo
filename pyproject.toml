[project]
name = "cuckoo"
version = "0.1.0"
description = "Agent bridge: manage Codex subagents programmatically"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.8"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuckoo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
markers = [
    "live: requires a real, authenticated codex binary (run with CUCKOO_LIVE=1 pytest -m live)",
]
addopts = "-m 'not live'"
